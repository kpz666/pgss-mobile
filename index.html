  function renderAI(){$('page-ai').innerHTML=`<div class="page-intro"><div class="eyebrow" style="color:var(--green)">HUMAN × AI</div><h1>AI 学习中心</h1><p>沿用你已有的ChatGPT，不额外购买API。通过复制指令与学习面板协作。</p></div>
    <div class="mode-list">${Object.entries(AIMODES).map(([k,v])=>`<button class="mode-item ${k===aiMode?'active':''}" data-action="aimode" data-value="${k}"><span class="mode-icon">${v.icon}</span><span class="mode-name">${v.name}</span><span class="mode-desc">${v.desc}</span></button>`).join('')}</div>
    <div class="callout"><strong>使用步骤很简单</strong><p>① 选学习模式 → ② 复制指令 → ③ 打开ChatGPT粘贴。系统不读取你的ChatGPT对话，也不会偷偷调用付费接口。</p></div>
    <div class="head"><div><h2>当前学习主题</h2><small>可在313知识库切换章节</small></div></div><select class="field" id="ai-chapter">${CATALOG_CHAPTERS.map(c=>`<option value="${esc(c.id)}" ${aiSource==='catalog'&&c.id===selectedCatalog?'selected':''}>${esc(c.bookId)} · ${esc(c.title)}</option>`).join('')}<optgroup label="原型示范专题">${CHAPTERS.map(c=>`<option value="${esc(c.id)}" ${aiSource==='sample'&&c.id===selectedChapter?'selected':''}>示范 · ${esc(c.title)}</option>`).join('')}</optgroup></select>
    <div class="head"><div><h2>专用学习指令</h2><small>已包含半自动模式与准确性要求</small></div></div><div class="prompt-preview" id="prompt-preview">${esc(aiPrompt())}</div><div class="actions"><button class="solid-btn" data-action="copyprompt">复制学习指令</button><button class="secondary-btn" data-action="openchat">打开 ChatGPT ↗</button></div>
    <div class="head"><div><h2>导入 AI 测评结果</h2><small>复制ChatGPT返回的JSON，粘贴到此处即可记录成绩</small></div></div>
    <div class="card"><p style="margin:0;color:var(--muted);font-size:12px">仅导入你确认正确的测评数据。请不要把全部聊天记录放在这里。</p><textarea id="ai-import" class="field" spellcheck="false" style="min-height:145px" placeholder='{"type":"assessment","subject":"313历史学基础","chapter":"春秋战国社会变革","correct":8,"total":10,"wrong_types":["因果分析"],"suggestion":"复习变法背景"}'></textarea><button class="solid-btn" data-action="importAssessment">导入并更新学习档案</button><div class="small-note" style="margin-top:10px">只解析合法JSON；会校验分数范围。AI给出的错误归因属于训练建议，并非事实认证。</div></div>
    <div class="top-warning">零新增费用版本使用“复制指令／粘贴结果”连接ChatGPT，不支持网页内直接调用AI，也不能自动同步聊天内容。</div>`;
  }
  function renderArchive(){const count=db.tests.length;const sumCorrect=db.tests.reduce((a,x)=>a+x.correct,0),sumTotal=db.tests.reduce((a,x)=>a+x.total,0);const avg=sumTotal?Math.round(100*sumCorrect/sumTotal):null;const due=dueReviews();let sessions=db.sessions.slice().reverse().slice(0,6),tests=db.tests.slice().reverse().slice(0,7),reviews=db.reviews.filter(x=>!x.done).slice().sort((a,b)=>a.date.localeCompare(b.date));
    $('page-archive').innerHTML=`<div class="page-intro"><div class="eyebrow" style="color:var(--green)">LEARNING EVIDENCE</div><h1>学习档案</h1><p>真实记录与独立测试优先。数据只存于当前浏览器，不自动上传云端。</p></div>
    <div class="stats"><div class="stat"><strong>${count}</strong><small>测评次数</small></div><div class="stat"><strong>${avg===null?'—':avg+'%'}</strong><small>累计题目正确率</small></div><div class="stat"><strong>${esc(minFmt(allSecs()))}</strong><small>累计计时</small></div></div>
    <div class="head"><div><h2>测评表现</h2><small>正确率按总答题数计算，不等于正式考试预测</small></div></div><div class="card"><div class="switch-row"><strong style="font-size:13px">已作答 ${sumTotal} 道题</strong><strong style="color:var(--green)">${avg===null?'暂无数据':`${sumCorrect} 道正确`}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${avg??0}%"></div></div>${tests.length?tests.map(x=>`<div class="archive-group"><div><strong>${esc(x.chapter||x.subject)}</strong><small>${esc(fmtDate(x.date))} · ${esc(x.source||'导入测评')}${Array.isArray(x.wrong_types)&&x.wrong_types.length?' · '+esc(x.wrong_types.join('、')):''}</small></div><span class="score">${esc(Math.round(100*x.correct/x.total))}%</span></div>`).join(''):'<div class="small-note" style="margin-top:15px">还没有测试记录。你可以完成313示范小测，也可以导入AI批改结果。</div>'}</div>
    <div class="head"><div><h2>复习队列</h2><small>根据测评表现生成，允许手动确认完成</small></div></div><div class="card">${reviews.length?reviews.slice(0,8).map(r=>`<div class="review-row"><span class="review-dot" style="background:${r.date<=today()?'var(--orange)':'#7cbea7'}"></span><div style="flex:1"><strong>${esc(r.title)}</strong><p>${esc(fmtDate(r.date))} · ${esc(r.reason||'间隔复习')}</p></div><button class="mini-btn" data-action="reviewdone" data-id="${esc(r.id)}">已复习</button></div>`).join(''):'<div class="small-note">暂无计划中的复习任务。</div>'}</div>
    <div class="head"><div><h2>学习计时记录</h2><small>仅统计使用本系统计时器的时间</small></div></div><div class="card">${sessions.length?sessions.map(s=>`<div class="archive-group"><div><strong>${esc(s.subject)}</strong><small>${esc(fmtDate(s.date))}</small></div><div style="font-weight:800">${esc(minFmt(s.durationSec))}</div></div>`).join(''):'<div class="small-note">还没有计时记录。</div>'}</div>
    <div class="head"><div><h2>数据与备份</h2><small>不要依赖手机浏览器作为唯一备份</small></div></div>
    <div class="card"><strong>我的学习数据</strong><p style="font-size:12px;color:var(--muted);margin-top:7px">导出完整JSON备份，换手机时可在新设备导入。不会向GitHub或ChatGPT自动上传个人学习记录。</p><div class="actions"><button class="solid-btn" data-action="export">↓ 导出备份</button><button class="secondary-btn" data-action="importbackup">↑ 恢复备份</button></div><p class="small-note">上次导出：${db.lastBackup?new Date(db.lastBackup).toLocaleString('zh-CN'):'从未导出'}。恢复操作会覆盖当前数据，执行前二次确认。</p><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="switch-row"><div><strong style="font-size:13px">删除本机学习记录</strong><p style="font-size:11px;color:var(--muted);margin:3px 0 0">危险操作，不可撤销</p></div><button class="secondary-btn danger" data-action="reset">清空数据</button></div></div>
    <div class="top-warning"><strong>请定期备份。</strong> 如果清除Safari网站数据、使用无痕模式或更换设备，本机记录可能消失。PGSS目前没有云端自动同步。</div>`;
  }
  function planReview(chapterId,score,iso= today()){
    if(!CHAPTERS.some(c=>c.id===chapterId)&&!findCatalog(chapterId))return;
    const gap=score<.8?3:7;
    const date=addDays(iso,gap);const reason=score<.8?'章节得分低于80%，需强化':'间隔复测';
    // 保留更早的未完成任务，避免新测评把既有复习一直往后推。
    if(db.reviews.some(r=>!r.done&&r.chapterId===chapterId))return;
    db.reviews.push({id:uid(),chapterId,title:(findCatalog(chapterId)||chapter(chapterId)).title,date,reason,done:false});
  }
  function startQuiz(){tab='chapters';quizStep=true;quizAnswers={};quizResult=null;render();}
  function submitQuiz(){for(let i=0;i<QUESTIONS.length;i++){const input=document.querySelector(`input[name="q${i}"]:checked`);if(!input){notify(`请先完成第${i+1}题`);return;}quizAnswers[i]=Number(input.value)}
    const details=QUESTIONS.map((q,i)=>({chapter:q.chapter,tag:q.tag,correct:quizAnswers[i]===q.a}));const correct=details.filter(d=>d.correct).length;const record={id:uid(),date:today(),createdAt:new Date().toISOString(),subject:'313历史学基础',chapter:'先秦与秦汉综合',source:'内置原创示范题',correct,total:QUESTIONS.length,details,wrong_types:[...new Set(details.filter(d=>!d.correct).map(d=>d.tag))]};db.tests.push(record);
    [...new Set(details.map(d=>d.chapter))].forEach(id=>{const d=details.filter(x=>x.chapter===id);planReview(id,d.filter(x=>x.correct).length/d.length)});
    quizResult={correct,total:QUESTIONS.length};persist();render();notify('成绩已保存，复习任务已更新');
  }
  async function copyText(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);notify('已复制，前往ChatGPT粘贴即可');return;}const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('fail');notify('已复制，前往ChatGPT粘贴即可')}catch(e){notify('自动复制未成功，请长按指令文本手动复制')}}
  function parseAssessment(txt){let s=txt.trim();s=s.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let r=JSON.parse(s);if(!r||typeof r!=='object'||Array.isArray(r))throw Error('JSON须为单个对象');if(r.type&&r.type!=='assessment')throw Error('type应为assessment');if(typeof r.subject!=='string'||!r.subject.trim())throw Error('缺少subject学科');if(typeof r.chapter!=='string'||!r.chapter.trim())throw Error('缺少chapter章节');if(!Number.isSafeInteger(r.correct)||!Number.isSafeInteger(r.total)||r.total<1||r.total>300||r.correct<0||r.correct>r.total)throw Error('correct/total必须为合理整数');if(r.wrong_types!==undefined&&(!Array.isArray(r.wrong_types)||!r.wrong_types.every(v=>typeof v==='string')))throw Error('wrong_types需要是字符串数组');return {id:uid(),date:today(),createdAt:new Date().toISOString(),source:'ChatGPT手工导入（未经独立验证）',subject:r.subject.slice(0,100),chapter:r.chapter.slice(0,120),correct:r.correct,total:r.total,wrong_types:(r.wrong_types||[]).slice(0,12).map(s=>s.slice(0,70)),suggestion:String(r.suggestion||'').slice(0,1500)};}
  function importAssessment(){const text=$('ai-import').value;if(!text.trim()){notify('先粘贴AI输出的JSON结果');return}try{const r=parseAssessment(text);db.tests.push(r);const match=CATALOG_CHAPTERS.find(c=>r.chapter===c.id||r.chapter===c.title)||CHAPTERS.find(c=>r.chapter===c.id||r.chapter===c.title);if(match)planReview(match.id,r.correct/r.total,r.date);persist();$('ai-import').value='';notify('测评已导入并保存');}catch(e){notify('导入失败：'+e.message)}}
  function exportBackup(){db.lastBackup=new Date().toISOString();persist();const blob=new Blob([JSON.stringify({format:'pgss-mobile-free-backup',exportedAt:db.lastBackup,data:db},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`PGSS-学习备份-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);render();notify('已生成备份文件，请保存到「文件」App或私有云盘')}
  async function importBackup(file){if(!file)return;try{const raw=await file.text();if(raw.length>8_000_000)throw Error('备份文件过大');const wrapped=JSON.parse(raw),d=wrapped?.format==='pgss-mobile-free-backup'?wrapped.data:null;if(!d||d.version!==1||!Array.isArray(d.tasks)||!Array.isArray(d.tests)||!Array.isArray(d.sessions)||!Array.isArray(d.reviews)||typeof d.chapters!=='object'||!d.chapters)throw Error('文件不是有效的PGSS V1备份');if(!confirm(`将恢复 ${d.tests.length} 条测评、${d.sessions.length} 条计时及其他档案，覆盖本机现有数据。确定继续？`))return;
      const old=db;db={...base(),...d};if(!persist()){db=old;throw Error('浏览器存储失败，旧数据已保留')};ensureDaily();render();notify('备份已恢复');}catch(e){notify('恢复失败：'+e.message)}finally{$('import-file').value=''}}
  function reset(){if(!confirm('这会永久删除此浏览器中的所有PGSS学习记录。请先导出备份。确认继续？'))return;const code=prompt('请输入「清空」以再次确认删除');if(code!=='清空'){notify('已取消删除');return}db=base();ensureDaily();render();notify('本机学习记录已清空')}
  function saveNote(){let ch=chapter(selectedChapter),note=$('chapter-note').value.trim().slice(0,25000),status=$('chapter-status').value;db.chapters[ch.id]={note,status,updatedAt:new Date().toISOString()};persist();render();notify('章节笔记已保存')}
  function openModal(){$('modal').classList.add('show');setTimeout(()=>$('new-task').focus(),40)}function closeModal(){$('modal').classList.remove('show');$('new-task').value=''}
  function addTask(){const t=$('new-task').value.trim();if(!t){notify('请先填写任务名称');return}db.tasks.push({id:uid(),date:today(),title:t.slice(0,90),subject:$('new-task-subject').value,done:false});persist();closeModal();render();notify('任务已加入今天的计划')}
  function stopTimer(){if(!db.activeTimer)return;const elapsed=Math.round((Date.now()-db.activeTimer.startAt)/1000);if(elapsed<10){if(!confirm('计时不足10秒，仍要保存吗？'))return}if(elapsed>18*3600&&!confirm('本次计时已超过18小时，确定仍要记录这段时间吗？'))return;db.sessions.push({id:uid(),date:today(),subject:db.activeTimer.subject,durationSec:elapsed});db.activeTimer=null;persist();render();notify('学习时长已记录')}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){go(nav.dataset.tab);return}const btn=e.target.closest('[data-action]');if(!btn)return;let action=btn.dataset.action,id=btn.dataset.id;
    switch(action){case'addtask':openModal();break;case'toggle':{const t=db.tasks.find(x=>x.id===id);if(t)t.done=!t.done;persist();render();break}case'deletetask':if(confirm('删除这项今日任务？')){db.tasks=db.tasks.filter(x=>x.id!==id);persist();render()}break;
    case'startTimer':db.activeTimer={startAt:Date.now(),subject:$('timer-subject').value};persist();render();break;case'stopTimer':stopTimer();break;
    case'archive':go('archive');break;case'toquiz':startQuiz();break;case'submitquiz':submitQuiz();break;case'retryquiz':startQuiz();break;case'backchapter':quizStep=false;quizResult=null;go('chapters');break;
    case'bookfilter':{bookFilter=btn.dataset.value;const opt=CATALOG.books.find(x=>bookFilter==='全部'||x.group===bookFilter);if(opt)selectedBook=opt.id;bookQuery='';render();break}
    case'catalogchapter':selectedCatalog=id;selectedBook=id.split('-')[0];bookQuery='';render();setTimeout(()=>document.getElementById('catalog-detail')?.scrollIntoView({behavior:'smooth',block:'start'}),50);break;
    case'catalogsave':{let c=findCatalog(selectedCatalog);if(c){const status=$('catalog-status').value,note=$('catalog-note').value.slice(0,25000);db.chapters[c.id]={...(db.chapters[c.id]||{}),status,note,updatedAt:new Date().toISOString()};persist();render();notify('已保存本章学习记录')}break}
    case'catalogai':aiSource='catalog';aiMode='teach';go('ai');break;
    case'cat':category=btn.dataset.value;render();break;case'chapter':selectedChapter=id;render();break;case'savenote':saveNote();break;case'chatai':aiSource='sample';aiMode='teach';go('ai');break;
    case'aimode':aiMode=btn.dataset.value;render();break;case'copyprompt':copyText(aiPrompt());break;case'openchat':window.open('https://chatgpt.com/','_blank','noopener,noreferrer');break;
    case'importAssessment':importAssessment();break;case'reviewdone':{const r=db.reviews.find(x=>x.id===id);if(r)r.done=true;persist();render();notify('已记录完成复习');break}
    case'export':exportBackup();break;case'importbackup':$('import-file').click();break;case'reset':reset();break;
    }
  });
  document.addEventListener('change',e=>{if(e.target.id==='book-select'){selectedBook=e.target.value;bookQuery='';selectedCatalog=CATALOG.books.find(b=>b.id===selectedBook)?.chapters[0]?.id||selectedCatalog;render();}else if(e.target.id==='ai-chapter'){if(findCatalog(e.target.value)){selectedCatalog=e.target.value;aiSource='catalog'}else {selectedChapter=e.target.value;aiSource='sample'}render();}else if(e.target.id==='catalog-status'){let c=findCatalog(selectedCatalog);if(c){db.chapters[c.id]={...(db.chapters[c.id]||{}),status:e.target.value,updatedAt:new Date().toISOString()};persist();notify('章节状态已更新')}}else if(e.target.matches('#chapter-status')){const ch=chapter(selectedChapter);db.chapters[ch.id]={...(db.chapters[ch.id]||{}),status:e.target.value,updatedAt:new Date().toISOString()};persist();notify('学习阶段已更新');}});
  document.addEventListener('input',e=>{if(e.target.id==='book-search'){bookQuery=e.target.value;const pos=e.target.selectionStart;renderBooks();const input=$('book-search');input?.focus();try{input?.setSelectionRange(pos,pos)}catch(err){}}});
  $('save-task').addEventListener('click',addTask);$('cancel-task').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('import-file').addEventListener('change',e=>importBackup(e.target.files[0]));
  setInterval(()=>{if(!db.activeTimer)return;const el=$('timer-clock');if(el)el.textContent=dur((Date.now()-db.activeTimer.startAt)/1000);},1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db.lastTaskPlanDate!==today()){ensureDaily();render()}});
  render();
})();
</script>
</body>
